name: factory-ci
on:
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read            # sem escrita; nenhuma secret exposta ao codigo testado
concurrency:
  group: factory-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest   # GitHub-hosted, descartavel (runner proprio e PROIBIDO)
    timeout-minutes: 30
    steps:
      - name: checkout do PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: politica do diff (ANTES de instalar/rodar o projeto do PR)
        run: python factory_control/validar_diff.py

      - name: instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: dependencias travadas (rejeita git/url/path/nao-fixadas)
        run: |
          test -f pyproject.toml || { echo "pyproject.toml ausente"; exit 1; }
          test -f uv.lock || { echo "uv.lock ausente"; exit 1; }
          uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (formatacao)
        run: uv run ruff format --check .

      - name: pyright (tipos)
        run: uv run pyright

      - name: bandit (seguranca)
        run: uv run bandit -q -r src

      - name: pip-audit (vulnerabilidades)
        run: uv run pip-audit

      - name: pytest
        run: uv run pytest -q --junitxml=reports/junit.xml

      - name: playwright (apps web)
        run: |
          if [ -f playwright.config.py ] || [ -d tests_web ]; then
            uv run playwright install --with-deps chromium
            uv run pytest -q tests_web --junitxml=reports/junit_web.xml
          else
            echo "sem interface web: pulando playwright"
          fi

      - name: testes de aceitacao CONFIAVEIS (vem da main protegida, hash verificado)
        run: python trusted_tests/run_trusted.py

      - name: build
        run: uv build

      - name: manifesto SHA-256
        run: python factory_control/gerar_manifesto.py

      - name: publicar artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: factory-artifact-${{ github.event.pull_request.number }}
          path: |
            dist/**
            reports/**
            artifact-manifest.json
          if-no-files-found: warn
